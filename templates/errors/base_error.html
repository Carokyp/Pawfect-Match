{% extends 'base.html' %}
{% load static %}

{% block layout %}
  <section>
    <article class="error-content pt-5 d-flex flex-column justify-content-center align-items-center text-center">
      <header>
        <h1>{% block error_code %}{% endblock %}</h1>
        <h2>{% block error_title %}{% endblock %}</h2>
      </header>
      <p>{% block error_message %}{% endblock %}</p>
      <img class="d-block mx-auto mb-5" src="{% static 'images/sad_dog.png' %}" alt="Sad dog illustration">
      <footer class="d-flex gap-4">
        <a href="{% url 'home' %}" class="btn error-btn primary">Back to Home</a>
        {% if user.is_authenticated %}
          <a href="{% url 'browse_dogs' %}" class="btn error-btn secondary">Browse Dogs</a>
        {% else %}
          <a href="{% url 'register' %}" class="btn error-btn secondary">Get Started</a>
        {% endif %}
      </footer>
    </article>
  </section>
{% endblock %}
