{% extends 'base.html' %}
{% load static %}

{% block layout %}
  <!-- 500 ERROR SECTION -->
  <section class="hero-section error-section">
    <div class="hero-content error-content">
      <h1>500</h1>
      <h2>Server Error</h2>
      <p>Oops! Something went wrong on our end. We're working on fixing it!</p>
      <img src="{% static 'images/sad_dog.png' %}" alt="sad dog">
      <div class="hero-buttons">
        <a href="{% url 'home' %}" class="btn-hero primary">Back to Home</a>
        {% if user.is_authenticated %}
        <a href="{% url 'browse_dogs' %}" class="btn-hero secondary">Browse Dogs</a>
        {% else %}
        <a href="{% url 'register' %}" class="btn-hero secondary">Get Started</a>
        {% endif %}
      </div>
    </div>
  </section>
{% endblock %}
