{% extends 'base.html' %}
{% load static %}

{% block layout %}
  <!-- 405 error content -->
  <section class="hero-section error-section">
    <article class="hero-content error-content">
      <header>
      <h1>405</h1>
      <h2>Method Not Allowed</h2>
      </header>
      <p>Sorry, this request method is not allowed for this page.</p>
      <img src="{% static 'images/sad_dog.png' %}" alt="Sad dog illustration">
      <footer class="hero-buttons">
        <a href="{% url 'home' %}" class="btn-hero primary">Back to Home</a>
        {% if user.is_authenticated %}
        <a href="{% url 'browse_dogs' %}" class="btn-hero secondary">Browse Dogs</a>
        {% else %}
        <a href="{% url 'register' %}" class="btn-hero secondary">Get Started</a>
        {% endif %}
      </footer>
    </article>
  </section>
{% endblock %}
