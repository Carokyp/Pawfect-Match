{% extends "base.html" %}

{% block header %}
  <!-- Navigation for unauthenticated users -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">🐾 Pawfect Match</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
          <a class="nav-link {% if request.resolver_match.url_name == 'sign_in' %}active{% endif %}" href="{% url 'sign_in' %}">Sign In</a>
          <a class="nav-link {% if request.resolver_match.url_name == 'register' %}active{% endif %}" href="{% url 'register' %}">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>
{% endblock %}

{% block layout %}
  <!-- Main content wrapper for authentication pages -->
  <div class="auth-content edit-profile-content d-flex flex-column align-items-center justify-content-center {% block content_class %}{% endblock %}">
    
    <!-- Optional back button block -->
    {% block back_button %}
    {% endblock %}
    
    <!-- Page-specific content -->
    {% block content %}
    {% endblock %}
    
  </div>
{% endblock %}
