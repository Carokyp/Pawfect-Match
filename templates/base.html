{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pawfect Match - Find your dog's perfect companion">
  <title>{% block title %}Pawfect Match{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
</head>
<body>
  <header>
    {% block header %}
      <!-- Navigation bar - override in child templates -->
    {% endblock %}
  </header>

  <main>
    {% block layout %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <h2 class="footer-title">FOLLOW US</h2>
      <div class="footer-socials">
        <a href="https://twitter.com/" target="_blank" aria-label="Twitter" class="footer-icon">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="https://instagram.com/" target="_blank" aria-label="Instagram" class="footer-icon">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://facebook.com/" target="_blank" aria-label="X" class="footer-icon">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
      </div>
      <div class="footer-copyright">Copyright 2026 - Pawfect Match. All Rights Reserved.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/e3247db897.js" crossorigin="anonymous"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
